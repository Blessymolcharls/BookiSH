<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BookiSH — Library Dashboard</title>
  <meta name="description" content="BookiSH Library Dashboard — browse, borrow, return and manage books."/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css?v=3" />
  <script src="assets/js/theme-toggle.js"></script>
</head>
<body data-page="library">

<div class="flex min-h-screen">

  <!-- ===== SIDEBAR ===== -->
  <aside class="w-64 fixed inset-y-0 left-0 z-30 flex flex-col bg-[var(--bg-darker)] border-r border-[var(--border-subtle)] p-6">
    <!-- Navbar Brand / Logo -->
    <div class="navbar-brand-wrap mb-10">
      <a href="index.html" class="navbar-brand">
        <div class="navbar-logo">📚</div>
        BookiSH
      </a>
    </div>

    <!-- Nav Links -->
    <nav class="flex flex-col gap-2">
      <a href="library.html" class="sub-nav-item active text-left py-3 px-4 rounded-xl">Library</a>
      <a href="borrow.html" class="sub-nav-item text-left py-3 px-4 rounded-xl">Borrow</a>
      <a href="return.html" class="sub-nav-item text-left py-3 px-4 rounded-xl">Return</a>
      <a href="add.html" class="sub-nav-item text-left py-3 px-4 rounded-xl">Add Book</a>
    </nav>
    
    <!-- Theme Toggle -->
    <div class="mt-auto pt-6 flex items-center justify-between mb-4">
      <span class="text-sm text-[var(--text-main)] font-semibold">Appearance</span>
      <button class="theme-toggle" title="Toggle Theme"></button>
    </div>

    <!-- User/Logout at bottom -->
    <div class="pt-4 border-t border-[var(--border-subtle)]">
      <div class="flex items-center justify-between">
        <span class="flex items-center gap-2 text-sm text-[var(--text-main)]">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Admin
        </span>
        <a href="login.html" class="btn-outline border-red-500/30 text-red-400 hover:bg-red-500/10 hover:text-red-300 hover:border-red-500/50 text-xs py-1.5 px-3">Logout</a>
      </div>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT WRAPPER ===== -->
  <div class="ml-64 flex-1 flex flex-col">
    <!-- Optional Top Bar (just for search if needed) -->
    <header class="py-4 px-8 border-b border-[var(--border-subtle)] flex items-center justify-between bg-[var(--bg-darker)]">
      <div class="navbar-search hidden md:flex max-w-md w-full ml-auto">
        <svg class="w-4 h-4 text-slate-400 absolute ml-3 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search title, author, or ID…" class="pl-9 w-full bg-transparent border-none text-[var(--text-main)] outline-none text-sm py-1.5"/>
      </div>
    </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="app-content products-page">
    
    <!-- Header & Stats -->
    <div class="products-header">
      <div>
        <h1>Book Collection</h1>
        <p>Browse and manage all books in the library</p>
      </div>
      
      <div class="flex gap-4">
        <!-- Stats Cards -->
        <div class="stat-card border-t-2 border-t-indigo-500">
          <p class="text-xl font-bold text-primary leading-none" id="statTotal">—</p>
          <p class="text-[10px] text-slate-400 uppercase tracking-wider mt-1">Total</p>
        </div>
        <div class="stat-card border-t-2 border-t-emerald-500">
          <p class="text-xl font-bold text-primary leading-none" id="statAvailable">—</p>
          <p class="text-[10px] text-slate-400 uppercase tracking-wider mt-1">Available</p>
        </div>
        <div class="stat-card border-t-2 border-t-amber-500">
          <p class="text-xl font-bold text-primary leading-none" id="statBorrowed">—</p>
          <p class="text-[10px] text-slate-400 uppercase tracking-wider mt-1">Borrowed</p>
        </div>
        <div class="stat-card border-t-2 border-t-orange-500">
          <p class="text-xl font-bold text-primary leading-none" id="statDueToday">—</p>
          <p class="text-[10px] text-slate-400 uppercase tracking-wider mt-1">Due Today</p>
        </div>
        <div class="stat-card border-t-2 border-t-red-500">
          <p class="text-xl font-bold text-primary leading-none" id="statOverdue">—</p>
          <p class="text-[10px] text-slate-400 uppercase tracking-wider mt-1">Overdue</p>
        </div>
        <div class="stat-card border-t-2 border-t-purple-500">
          <p class="text-xl font-bold text-primary leading-none" id="statFines">—</p>
          <p class="text-[10px] text-slate-400 uppercase tracking-wider mt-1">Fines</p>
        </div>
      </div>
    </div>

    <!-- Hidden datalists (required by existing JS) -->
    <datalist id="bookIds"></datalist>
    <datalist id="borrowedBookIds"></datalist>



    <!-- Book grid — ID preserved for JS -->
    <div id="bookList" class="products-grid mt-4"></div>

  </main>



</div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/alerts.js"></script>
  <script src="assets/js/library.js?v=7"></script>
</body>
</html>
