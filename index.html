<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookiSH — Welcome</title>
  <meta name="description" content="BookiSH — your modern library management system. Explore, borrow, and return books with ease." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css?v=3" />
  <script src="assets/js/theme-toggle.js"></script>
</head>
<body class="min-h-screen bg-[#0A0A0A] flex flex-col items-center justify-center p-4 relative overflow-hidden">

  <!-- Particle container — styled by .landing-particles in theme.css -->
  <div class="landing-particles" id="particleContainer"></div>

  <!-- Background orbs from theme.css -->
  <div class="landing-background">
    <div class="landing-bg-orb landing-orb-1"></div>
    <div class="landing-bg-orb landing-orb-2"></div>
    <div class="landing-bg-orb landing-orb-3"></div>
    <div class="landing-bg-orb landing-orb-4"></div>
  </div>

  <!-- Card -->
  <div class="relative z-10 w-full max-w-[420px] bg-[#121212] border border-[#d1a85b]/10 rounded-[2rem] p-10 flex flex-col items-center text-center shadow-2xl shadow-black/50 fade-up">

    <!-- Icon -->
    <div class="w-16 h-16 rounded-[1rem] bg-[#1a1a1a] border border-[#d1a85b]/20 flex items-center justify-center mb-6">
      <span class="text-3xl">📚</span>
    </div>

    <!-- Title & Subtitle -->
    <h1 class="text-3xl font-extrabold text-[#d1a85b] mb-2 tracking-tight">BookiSH</h1>
    <p class="text-neutral-500 text-sm mb-10 leading-relaxed max-w-[280px]">
      Your modern library management system.
    </p>

    <!-- Buttons -->
    <div class="w-full flex flex-col gap-4">
      <a href="login.html" class="w-full flex items-center justify-center gap-3 bg-[#cda252] hover:bg-[#b88f42] text-black font-bold px-6 py-4 rounded-[1rem] transition-all duration-300 shadow-[0_0_30px_rgba(205,162,82,0.15)] hover:shadow-[0_0_40px_rgba(205,162,82,0.25)] hover:-translate-y-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
        Get Started
      </a>

      <a href="available.html" class="w-full flex items-center justify-center gap-2 bg-[#1a1a1a] border border-white/5 hover:bg-[#222] text-white font-semibold px-6 py-4 rounded-[1rem] transition-all duration-300">
        Browse Library
      </a>
    </div>

  </div>

  <script>
    // Spawn landing particles — uses .landing-particle class defined in theme.css
    document.addEventListener('DOMContentLoaded', function () {
      const container = document.getElementById('particleContainer');
      if (!container) return;

      const COUNT = 28;
      for (let i = 0; i < COUNT; i++) {
        const p = document.createElement('span');
        p.className = 'landing-particle';

        const size = Math.random() * 4 + 2; // 2–6px
        const left = Math.random() * 100;
        const delay = Math.random() * 12;
        const duration = Math.random() * 10 + 8; // 8–18s

        p.style.cssText = `
          width: ${size}px;
          height: ${size}px;
          left: ${left}%;
          bottom: -10px;
          animation-duration: ${duration}s;
          animation-delay: ${delay}s;
        `;
        container.appendChild(p);
      }
    });
  </script>

</body>
</html>
