<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookiSH — Login</title>
  <meta name="description" content="Sign in or register for BookiSH library management system." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css?v=3" />
  <script src="assets/js/theme-toggle.js"></script>
</head>

<body class="landing-page" data-page="login">
  <button class="theme-toggle" style="position: fixed; top: 1.5rem; right: 2rem; z-index: 100;" title="Toggle Theme"></button>

  <!-- Particle container -->
  <div class="landing-particles" id="particleContainer"></div>

  <!-- Background orbs using the correct CSS class names from theme.css -->
  <div class="landing-background">
    <div class="landing-bg-orb landing-orb-1"></div>
    <div class="landing-bg-orb landing-orb-2"></div>
    <div class="landing-bg-orb landing-orb-3"></div>
    <div class="landing-bg-orb landing-orb-4"></div>
  </div>

  <div class="relative z-10 w-full max-w-sm m-auto py-10">

    <!-- Card -->
    <div class="landing-glass-card flex flex-col max-h-[90vh]">
      <!-- Header -->
      <div class="text-center mb-8 shrink-0">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4"
          style="background: rgba(209,168,91,0.1); border: 1px solid rgba(209,168,91,0.3);">
          <span class="text-2xl">📚</span>
        </div>
        <h1 class="text-2xl font-bold text-primary">Welcome</h1>
        <p class="text-secondary text-sm mt-1">Access the library</p>
      </div>

      <!-- Form -->
      <form id="loginForm" class="space-y-4 overflow-y-auto pr-2" style="scrollbar-width: thin;" onsubmit="event.preventDefault(); currentTab === 'signin' ? handleSignIn() : handleSignUp();">
        <!-- Role Selection -->
        <div>
          <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Role</label>
          <select id="loginRole" class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary focus:outline-none focus:ring-2 focus:ring-[#d1a85b] focus:border-transparent transition-all" onchange="toggleRole()" required>
            <option value="" disabled selected class="bg-page">Select Role</option>
            <option value="Student" class="bg-page">Student</option>
            <option value="Admin" class="bg-page">Admin</option>
          </select>
        </div>

        <div id="studentTabs" class="hidden flex border-b border-subtle mb-4 shrink-0 transition-all duration-300">
          <button type="button" id="tabSignIn" class="flex-1 py-2 text-sm font-medium border-b-2 border-[#d1a85b] text-[#d1a85b] transition-all" onclick="switchTab('signin')">Sign In</button>
          <button type="button" id="tabSignUp" class="flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-secondary hover:text-primary transition-all" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Sign In Form (Admin & Student) -->
        <div id="signInSection" class="space-y-4 hidden">
          <div id="adminUsernameField" class="hidden">
            <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Username</label>
            <input type="text" id="username" placeholder="Enter your username" autocomplete="off" class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary focus:outline-none focus:ring-2 focus:ring-[#d1a85b] transition-all" oninput="clearError('username')" />
            <span class="text-red-500 text-xs hidden mt-1" id="err-username"></span>
          </div>
          <div id="studentIdField" class="hidden">
            <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Student ID</label>
            <input type="text" id="studentId" placeholder="Enter your Student ID" autocomplete="off" class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary focus:outline-none focus:ring-2 focus:ring-[#d1a85b] transition-all" oninput="clearError('studentId')" />
            <span class="text-red-500 text-xs hidden mt-1" id="err-studentId"></span>
          </div>
          
          <div>
            <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Password</label>
            <div class="relative">
              <input type="password" id="password" placeholder="Enter your password" autocomplete="new-password" class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary focus:outline-none focus:ring-2 focus:ring-[#d1a85b] transition-all" oninput="clearError('password')" />
              <button type="button" onclick="togglePassword('password')" class="absolute inset-y-0 right-3 flex items-center text-secondary hover:text-primary">👁️</button>
            </div>
            <span class="text-red-500 text-xs hidden mt-1" id="err-password"></span>
          </div>
          <button type="button" id="btnSignIn" class="w-full btn-primary py-3 mt-6 mb-4 text-base relative" onclick="handleSignIn()">
            <span id="txtSignIn">Sign In</span>
            <span id="spinSignIn" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          </button>
        </div>

        <!-- Sign Up Form (Student Only) -->
        <div id="signUpSection" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Full Name</label>
            <input type="text" id="regName" placeholder="Enter your full name" autocomplete="off" oninput="validateSignUp()" class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary focus:outline-none focus:ring-2 focus:ring-[#d1a85b] transition-all" />
            <span class="text-red-500 text-xs hidden mt-1" id="err-regName"></span>
          </div>
          <div>
            <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Student ID</label>
            <input type="text" id="regStudentId" placeholder="Enter your Student ID" autocomplete="off" oninput="validateSignUp()" class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary focus:outline-none focus:ring-2 focus:ring-[#d1a85b] transition-all" />
            <span class="text-red-500 text-xs hidden mt-1" id="err-regStudentId"></span>
          </div>
          <div>
            <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Email Address</label>
            <input type="email" id="regEmail" placeholder="Enter your email" autocomplete="off" oninput="validateSignUp()" class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary focus:outline-none focus:ring-2 focus:ring-[#d1a85b] transition-all" />
            <span class="text-red-500 text-xs hidden mt-1" id="err-regEmail"></span>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Department</label>
              <input type="text" id="regDepartment" placeholder="Enter department" autocomplete="off" oninput="validateSignUp()" class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary focus:outline-none focus:ring-2 focus:ring-[#d1a85b] transition-all" />
              <span class="text-red-500 text-xs hidden mt-1" id="err-regDepartment"></span>
            </div>
            <div>
              <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Year/Semester</label>
              <input type="text" id="regYear" placeholder="Enter year/semester" autocomplete="off" oninput="validateSignUp()" class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary focus:outline-none focus:ring-2 focus:ring-[#d1a85b] transition-all" />
              <span class="text-red-500 text-xs hidden mt-1" id="err-regYear"></span>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Password</label>
            <div class="relative">
              <input type="password" id="regPassword" placeholder="Enter your password" autocomplete="new-password" oninput="validateSignUp()" class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary focus:outline-none focus:ring-2 focus:ring-[#d1a85b] transition-all" />
              <button type="button" onclick="togglePassword('regPassword')" class="absolute inset-y-0 right-3 flex items-center text-secondary hover:text-primary">👁️</button>
            </div>
            <span class="text-red-500 text-xs hidden mt-1" id="err-regPassword"></span>
          </div>
          <div>
            <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Confirm Password</label>
            <div class="relative">
              <input type="password" id="regConfirmPassword" placeholder="Confirm your password" autocomplete="new-password" oninput="validateSignUp()" class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary focus:outline-none focus:ring-2 focus:ring-[#d1a85b] transition-all" />
              <button type="button" onclick="togglePassword('regConfirmPassword')" class="absolute inset-y-0 right-3 flex items-center text-secondary hover:text-primary">👁️</button>
            </div>
            <span class="text-red-500 text-xs hidden mt-1" id="err-regConfirmPassword"></span>
          </div>
          
          <button type="button" id="btnSignUp" class="w-full btn-primary py-3 mt-6 mb-4 text-base relative opacity-50 cursor-not-allowed" onclick="handleSignUp()" disabled>
            <span id="txtSignUp">Create Account</span>
            <span id="spinSignUp" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          </button>
        </div>
      </form>

    </div>

    <p class="text-center text-secondary text-xs mt-6">
      <a href="index.html" class="hover:text-primary transition-colors">← Back to home</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/alerts.js"></script>
  <script src="assets/js/login.js?v=2"></script>
  <script>
    // Spawn landing particles using .landing-particle class from theme.css
    document.addEventListener('DOMContentLoaded', function () {
      const container = document.getElementById('particleContainer');
      if (!container) return;
      const COUNT = 24;
      for (let i = 0; i < COUNT; i++) {
        const p = document.createElement('span');
        p.className = 'landing-particle';
        const size = Math.random() * 4 + 2;
        const left = Math.random() * 100;
        const delay = Math.random() * 12;
        const duration = Math.random() * 10 + 8;
        p.style.cssText = `width:${size}px;height:${size}px;left:${left}%;bottom:-10px;animation-duration:${duration}s;animation-delay:${delay}s;`;
        container.appendChild(p);
      }
    });
  </script>
</body>

</html>
