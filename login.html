<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BookiSH — Login</title>
  <meta name="description" content="Sign in to BookiSH library management system."/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp .5s ease-out both; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center px-4 relative overflow-hidden">

  <!-- Background blobs -->
  <div class="absolute top-1/3 -left-24 w-80 h-80 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/3 -right-24 w-80 h-80 bg-violet-600/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-sm fade-up">

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg mx-auto mb-4">
          <span class="text-2xl">📚</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Welcome back</h1>
        <p class="text-gray-500 text-sm mt-1">Sign in to access the library</p>
      </div>

      <!-- Form -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Username</label>
          <input type="text" id="username" placeholder="admin" required
                 class="w-full px-4 py-3 text-sm bg-gray-50 border border-gray-200 rounded-xl
                        focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-all"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Password</label>
          <input type="password" id="password" placeholder="••••••••" required
                 class="w-full px-4 py-3 text-sm bg-gray-50 border border-gray-200 rounded-xl
                        focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-all"/>
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold
                       py-3 rounded-xl transition-all duration-200 hover:shadow-lg hover:shadow-indigo-200/60 mt-2">
          Sign In
        </button>
      </form>

      <p class="text-center text-xs text-gray-400 mt-6">
        Default credentials: <span class="font-mono bg-gray-100 px-1.5 py-0.5 rounded">admin</span> /
        <span class="font-mono bg-gray-100 px-1.5 py-0.5 rounded">password</span>
      </p>
    </div>

    <p class="text-center text-slate-500 text-xs mt-6">
      <a href="index.html" class="hover:text-white transition-colors">← Back to home</a>
    </p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      if (username === 'admin' && password === 'password') {
        window.location.href = 'library.html';
      } else {
        alert('Invalid username or password. Please try again.');
      }
    });
  </script>
</body>
</html>
