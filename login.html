<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookiSH — Login</title>
  <meta name="description" content="Sign in to BookiSH library management system." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>

<body class="landing-page min-h-screen flex items-center justify-center relative overflow-hidden" data-page="login">

  <!-- Background elements -->
  <div class="landing-hero-orb orb-1"></div>
  <div class="landing-hero-orb orb-2"></div>

  <div class="relative z-10 w-full max-w-sm">

    <!-- Card -->
    <div class="landing-glass-card">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4"
          style="background: rgba(209,168,91,0.1); border: 1px solid rgba(209,168,91,0.3);">
          <span class="text-2xl">📚</span>
        </div>
        <h1 class="text-2xl font-bold text-white">Welcome back</h1>
        <p class="text-white/60 text-sm mt-1">Sign in to access the library</p>
      </div>

      <!-- Form -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-white/50 mb-1.5 uppercase tracking-wide">Username</label>
          <input type="text" id="username" required
            class="w-full px-4 py-3 text-sm bg-black/30 border border-white/10 rounded-xl text-white
                        focus:outline-none focus:ring-2 focus:ring-[#d1a85b] focus:border-transparent transition-all" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-white/50 mb-1.5 uppercase tracking-wide">Password</label>
          <input type="password" id="password" required
            class="w-full px-4 py-3 text-sm bg-black/30 border border-white/10 rounded-xl text-white
                        focus:outline-none focus:ring-2 focus:ring-[#d1a85b] focus:border-transparent transition-all" />
        </div>
        <button type="submit" class="w-full btn-primary py-3 mt-4 text-base">
          Sign In
        </button>
      </form>


    </div>

    <p class="text-center text-white/50 text-xs mt-6">
      <a href="index.html" class="hover:text-white transition-colors">← Back to home</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/alerts.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      if (username === 'bookish' && password === 'BookiSH@123') {
        showToast('Login successful!', 'success');
        setTimeout(() => { window.location.href = 'library.html'; }, 800);
      } else {
        showError('Login Failed', 'Invalid username or password. Please try again.');
      }
    });
  </script>
</body>

</html>
