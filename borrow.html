<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BookiSH — Borrow</title>
  <meta name="description" content="Borrow a book from the BookiSH library."/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css?v=3" />
  <script src="assets/js/theme-toggle.js"></script>
</head>
<body data-page="borrow">

<div class="flex min-h-screen">

  <!-- ===== SIDEBAR ===== -->
  <aside class="w-64 fixed inset-y-0 left-0 z-30 flex flex-col bg-[var(--bg-darker)] border-r border-[var(--border-subtle)] p-6">
    <!-- Navbar Brand / Logo -->
    <div class="navbar-brand-wrap mb-10">
      <a href="index.html" class="navbar-brand">
        <div class="navbar-logo">📚</div>
        BookiSH
      </a>
    </div>

    <!-- Nav Links -->
    <nav class="flex flex-col gap-2">
      <a href="library.html" class="sub-nav-item text-left py-3 px-4 rounded-xl">Library</a>
      <a href="borrow.html" class="sub-nav-item active text-left py-3 px-4 rounded-xl">Borrow</a>
      <a href="return.html" class="sub-nav-item text-left py-3 px-4 rounded-xl">Return</a>
      <a href="add.html" class="sub-nav-item text-left py-3 px-4 rounded-xl">Add Book</a>
    </nav>
    
    <!-- Theme Toggle -->
    <div class="mt-auto pt-6 flex items-center justify-between mb-4">
      <span class="text-sm text-[var(--text-main)] font-semibold">Appearance</span>
      <button class="theme-toggle" title="Toggle Theme"></button>
    </div>

    <!-- User/Logout at bottom -->
    <div class="pt-4 border-t border-[var(--border-subtle)]">
      <div class="flex items-center justify-between">
        <span class="flex items-center gap-2 text-sm text-[var(--text-main)]">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Admin
        </span>
        <a href="login.html" class="btn-outline border-red-500/30 text-red-400 hover:bg-red-500/10 hover:text-red-300 hover:border-red-500/50 text-xs py-1.5 px-3">Logout</a>
      </div>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT WRAPPER ===== -->
  <div class="ml-64 flex-1 flex flex-col pt-8">

  <!-- ===== MAIN CONTENT ===== -->
  <main class="app-content products-page">
    
    <div class="products-header">
      <div>
        <h1>Borrow a Book</h1>
        <p>Reserve an available title</p>
      </div>
    </div>

    <!-- Hidden datalist (required by JS) -->
    <datalist id="bookIds"></datalist>

    <section class="landing-glass-card max-w-lg mt-4">
      <form id="borrowForm" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Book ID</label>
          <input type="text" id="borrowTitle" placeholder="Select or type a book ID" required list="bookIds" autocomplete="off"
                 class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary
                        focus:outline-none focus:ring-2 focus:ring-[#d1a85b] focus:border-transparent transition-all"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Student ID</label>
          <input type="text" id="studentId" placeholder="Enter student ID" required
                 class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary
                        focus:outline-none focus:ring-2 focus:ring-[#d1a85b] focus:border-transparent transition-all"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-secondary mb-1.5 uppercase tracking-wide">Student Name</label>
          <input type="text" id="borrower" placeholder="Enter student name" required
                 class="w-full px-4 py-3 text-sm bg-card border border-subtle rounded-xl text-primary
                        focus:outline-none focus:ring-2 focus:ring-[#d1a85b] focus:border-transparent transition-all"/>
        </div>
        <button type="submit" class="w-full btn-primary py-3 flex items-center justify-center gap-2 mt-4 text-base">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 16l-4-4m0 0l4-4m-4 4h18"/>
          </svg>
          Borrow
        </button>
      </form>
    </section>

    <div class="mt-12">
      <h2 class="text-xl font-bold text-primary mb-4">Currently Borrowed Books</h2>
      <div id="activeBorrowsList" class="landing-glass-card p-0 overflow-hidden">
        <!-- Rendered by JS -->
      </div>
    </div>

  </main>



</div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/alerts.js"></script>
  <script src="assets/js/library.js?v=7"></script>
</body>
</html>
