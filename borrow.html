<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BookiSH — Borrow</title>
  <meta name="description" content="Borrow a book from the BookiSH library."/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up  { animation: fadeUp .35s ease-out both; }
  </style>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen" data-page="borrow">

  <!-- Mobile overlay -->
  <div id="overlay" onclick="closeSidebar()"
       class="fixed inset-0 bg-black/40 z-20 hidden lg:hidden"></div>

  <!-- ===== SIDEBAR ===== -->
  <aside id="sidebar"
         class="fixed inset-y-0 left-0 w-64 bg-slate-900 z-30 flex flex-col
                -translate-x-full lg:translate-x-0 transition-transform duration-300">

    <!-- Logo -->
    <div class="px-6 py-5 border-b border-slate-700/60">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📚</span>
        <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">BookiSH</span>
      </div>
      <p class="text-slate-500 text-[11px] font-semibold tracking-widest uppercase mt-1">Library System</p>
    </div>

    <!-- Nav links -->
    <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">

      <a href="library.html" onclick="activate(this)" data-page="library"
         class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
        Library
      </a>

      <a href="borrow.html" onclick="activate(this)" data-page="borrow"
         class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 16l-4-4m0 0l4-4m-4 4h18"/>
        </svg>
        Borrow
      </a>

      <a href="return.html" onclick="activate(this)" data-page="return"
         class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
        </svg>
        Return
      </a>

      <a href="add.html" onclick="activate(this)" data-page="add"
         class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        Add Book
      </a>

      <a href="resources.html" onclick="activate(this)" data-page="resources"
         class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.1-1.1m-.758-4.9a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
        </svg>
        Resources
      </a>
    </nav>

    <!-- User chip -->
    <div class="px-3 py-4 border-t border-slate-700/60">
      <div class="flex items-center gap-3 bg-slate-800 rounded-xl px-3 py-2.5">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">A</div>
        <div class="min-w-0">
          <p class="text-white text-sm font-semibold truncate">Admin</p>
          <p class="text-slate-500 text-xs">Administrator</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===== MAIN WRAPPER ===== -->
  <div class="lg:ml-64 flex flex-col min-h-screen">

    <!-- Top Navbar -->
    <header class="sticky top-0 z-10 bg-white/80 backdrop-blur-sm border-b border-gray-100 px-4 lg:px-8 h-16 flex items-center gap-4">
      <!-- Hamburger -->
      <button onclick="openSidebar()" class="lg:hidden p-1.5 rounded-lg hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <div class="flex flex-col">
        <span class="text-xs text-gray-500">Library System</span>
        <h1 class="text-sm font-semibold text-gray-900">Borrow</h1>
      </div>

      <!-- Right -->
      <div class="ml-auto flex items-center gap-3">
        <span class="hidden sm:flex items-center gap-1.5 text-sm text-gray-500">
          <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
          Welcome, <strong class="text-gray-800 font-semibold">Admin</strong>
        </span>
        <a href="login.html"
           class="flex items-center gap-1.5 bg-red-500 hover:bg-red-600 text-white text-sm font-semibold
                  px-4 py-2 rounded-full transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-red-200/60">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Logout
        </a>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 px-4 lg:px-8 py-8">
      <section class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 max-w-lg fade-up">
        <div class="flex items-center gap-3 mb-6">
          <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center flex-shrink-0">
            <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 16l-4-4m0 0l4-4m-4 4h18"/>
            </svg>
          </div>
          <div>
            <h2 class="text-base font-bold text-gray-900">Borrow a Book</h2>
            <p class="text-xs text-gray-500">Reserve an available title</p>
          </div>
        </div>

        <!-- Hidden datalist (required by JS) -->
        <datalist id="bookIds"></datalist>

        <form id="borrowForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Book ID</label>
            <input type="text" id="borrowTitle" placeholder="Select or type a book ID" required list="bookIds" autocomplete="off"
                   class="w-full px-4 py-3 text-sm bg-gray-50 border border-gray-200 rounded-xl
                          focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-all"/>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Your Name</label>
            <input type="text" id="borrower" placeholder="Enter your full name" required
                   class="w-full px-4 py-3 text-sm bg-gray-50 border border-gray-200 rounded-xl
                          focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-all"/>
          </div>
          <button type="submit"
                  class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-semibold
                         py-3 rounded-xl transition-all duration-200 hover:shadow-lg hover:shadow-indigo-200/60
                         flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 16l-4-4m0 0l4-4m-4 4h18"/>
            </svg>
            Borrow
          </button>
        </form>
      </section>
    </main>

    <footer class="px-8 py-4 border-t border-gray-100 text-center text-xs text-gray-400">
      © 2025 BookiSH · Library Management System
    </footer>
  </div>

  <script src="assets/js/library.js"></script>
  <script>
    // Sidebar
    function openSidebar() {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('overlay').classList.remove('hidden');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('overlay').classList.add('hidden');
    }

    // Active nav
    function activate(el) {
      if (!el) return;
      document.querySelectorAll('.nav-link').forEach(l => {
        l.classList.remove('active-link', 'bg-indigo-600', 'text-white');
        l.classList.add('text-slate-400', 'hover:text-white', 'hover:bg-slate-800');
      });
      el.classList.add('bg-indigo-600', 'text-white');
      el.classList.remove('text-slate-400', 'hover:text-white', 'hover:bg-slate-800');
    }

    // Highlight first nav on load
    document.addEventListener('DOMContentLoaded', () => {
      const page = document.body.dataset.page;
      const current = document.querySelector(`.nav-link[data-page="${page}"]`);
      activate(current || document.querySelector('.nav-link'));
    });
  </script>
</body>
</html>
